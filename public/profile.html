<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Profil · KPSS Akıllı</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content w-full">
      <div class="max-w-2xl mx-auto p-4 sm:p-6 space-y-5 pb-10">

        <!-- Başlık -->
        <div class="fadeIn">
          <h1 class="text-2xl font-extrabold text-slate-900 flex items-center gap-2">👤 Profil</h1>
          <p class="text-sm text-slate-500 mt-0.5">Hesap bilgilerini ve çalışma tercihlerini yönet.</p>
        </div>

        <div id="content">
          <div class="space-y-4">
            <div class="skeleton h-28 w-full"></div>
            <div class="skeleton h-96 w-full"></div>
          </div>
        </div>

        <!-- Hata durumu -->
        <div id="error-state" class="hidden card p-8 text-center">
          <div class="text-4xl mb-3">😕</div>
          <p class="text-slate-600 font-medium mb-1">Profil yüklenirken bir sorun oluştu.</p>
          <button id="retry-btn" class="btn-primary px-5 py-2.5 mt-2">Tekrar Dene</button>
        </div>
      </div>
    </main>
    <nav id="bottomnav"></nav>
  </div>

  <!-- Floating AI Assistant Button -->
  <a href="assistant.html" class="fixed bottom-24 md:bottom-6 right-4 md:right-6 z-50 w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-lg" style="background: linear-gradient(135deg, #6366f1, #7c3aed); box-shadow: 0 6px 20px rgba(99,102,241,.45);" title="AI Asistan">
    🤖
  </a>

  <script type="module" src="js/profile.js"></script>
</body>
</html>

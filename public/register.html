<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kayıt Ol · KPSS Akıllı</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
<link rel="stylesheet" href="css/tailwind-static.css?v=6" />
<link rel="stylesheet" href="css/styles.css?v=7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
</head>
<body class="bg-gradient-to-br from-teal-50 via-white to-sky-50 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden">
  <div class="auth-blob" style="width:320px;height:320px;background:#2dd4bf;top:-80px;right:-100px;left:auto;"></div>
  <div class="auth-blob" style="width:280px;height:280px;background:#7dd3fc;bottom:-60px;left:-80px;animation-delay:2s;"></div>
  <div class="w-full max-w-sm relative z-10">
    <div class="text-center mb-8">
      <div class="w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center text-white" style="background: linear-gradient(135deg, #0f766e, #0ea5e9 55%, #22d3ee); box-shadow: 0 10px 28px rgba(15,118,110,.45), inset 0 1px 0 rgba(255,255,255,.2);"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="1.6" class="icon-svg" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 16.5a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z"/><path stroke-linecap="round" stroke-linejoin="round" d="M12 12.75a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Z"/></svg></div>
      <h1 class="text-2xl font-extrabold text-slate-900">Hesap Oluştur</h1>
      <p class="text-sm text-slate-500 mt-1">KPSS'ye hazırlanmaya hemen başla.</p>
    </div>
    <form id="register-form" class="card p-6 space-y-4">
      <div>
        <label class="text-sm font-medium text-slate-700 block mb-1.5">Ad Soyad</label>
        <input id="full_name" required class="input" placeholder="Adın Soyadın" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700 block mb-1.5">E-posta</label>
        <input id="email" type="email" required class="input" placeholder="ornek@eposta.com" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700 block mb-1.5">Şifre</label>
        <input id="password" type="password" required minlength="6" class="input" placeholder="En az 6 karakter" />
      </div>
      <!-- Honeypot: gerçek kullanıcılar bunu görmez/doldurmaz, formu otomatik
           dolduran botlar genelde doldurur. "website" gibi bot'ların autofill
           sırasında sıkça hedef aldığı bir isim seçildi. -->
      <div class="hp-field" aria-hidden="true">
        <label for="website">Web siteniz</label>
        <input id="website" name="website" type="text" tabindex="-1" autocomplete="off" />
      </div>
      <button type="submit" id="submit-btn" class="btn-primary w-full py-2.5">Kayıt Ol</button>
      <p id="error-msg" class="text-sm text-rose-600 hidden"></p>
    </form>
    <p class="text-center text-sm text-slate-500 mt-5">Zaten hesabın var mı? <a href="login.html" class="text-teal-600 font-semibold hover:underline">Giriş yap</a></p>
  </div>
<script type="module">
import { supabase } from "./js/supabaseClient.js";
import { redirectIfAuthed } from "./js/auth.js";
await redirectIfAuthed();

const form = document.getElementById("register-form");
const errorMsg = document.getElementById("error-msg");

// Basit bot koruması: (1) honeypot alanı doluysa, (2) form sayfa açılışından
// çok kısa bir süre (<1.2sn) sonra gönderildiyse muhtemelen bir bot/otomatik
// script'tir — gerçek bir kullanıcının 3 alanı doldurup göndermesi (şifre
// yöneticisiyle otomatik doldursa bile) bu kadar hızlı olmaz. Bu client-taraflı
// bir caydırıcıdır; kararlı botlara veya IP başına istek sınırlamasına karşı
// asıl koruma Supabase projesinin Authentication ayarlarından (CAPTCHA/Turnstile,
// e-posta doğrulama zorunluluğu) etkinleştirilmelidir — bu depoya erişimimiz
// sadece migration dosyaları üzerinden olduğu için o ayarlar buradan yönetilemiyor.
const formRenderedAt = Date.now();
const MIN_SUBMIT_MS = 1200;

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorMsg.classList.add("hidden");

  const honeypotValue = document.getElementById("website").value;
  if (honeypotValue) {
    // Bot: sessizce reddet, gerçek kullanıcı bunu hiç görmeyeceği için
    // mesajın "doğruluğu" önemli değil.
    errorMsg.textContent = "Kayıt oluşturulamadı, lütfen tekrar dene.";
    errorMsg.classList.remove("hidden");
    return;
  }
  if (Date.now() - formRenderedAt < MIN_SUBMIT_MS) {
    errorMsg.textContent = "Form çok hızlı gönderildi, lütfen tekrar dene.";
    errorMsg.classList.remove("hidden");
    return;
  }

  const btn = document.getElementById("submit-btn");
  btn.disabled = true; btn.textContent = "Kayıt oluşturuluyor...";
  const { data, error } = await supabase.auth.signUp({
    email: document.getElementById("email").value.trim(),
    password: document.getElementById("password").value,
    options: { data: { full_name: document.getElementById("full_name").value.trim() } },
  });
  if (error) {
    errorMsg.textContent = error.message.includes("already registered") ? "Bu e-posta zaten kayıtlı." : "Kayıt başarısız: " + error.message;
    errorMsg.classList.remove("hidden");
    btn.disabled = false; btn.textContent = "Kayıt Ol";
    return;
  }
  window.location.href = "onboarding.html";
});
</script>
</body>
</html>

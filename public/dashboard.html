<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ana Sayfa · KPSS Akıllı</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
<link rel="stylesheet" href="css/tailwind-static.css?v=6" />
<link rel="stylesheet" href="css/styles.css?v=7" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
</head>
<body class="bg-slate-50">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content w-full">
      <div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-5 pb-28 sm:pb-10 stagger">

        <!-- 1+2. Hero: selamlama + rozet istatistikleri + sınav geri sayımı, tek büyük kartta.
             İskelet yüksekliği (420px), gerçek hero kartının (sınavlı hâliyle, en yaygın
             durum) ölçülmüş yüksekliğine (~416-487px) yakın tutuldu — eskiden h-56 (224px)
             idi, gerçek karttan ~2 kat kısaydı ve veri gelince belirgin bir "zıplama"
             (layout shift) yaratıyordu. -->
        <div id="hero-card" class="fadeIn">
          <div class="skeleton h-[420px] w-full" style="border-radius: var(--radius);"></div>
        </div>

        <!-- Günün ipucu (motivasyon) — deterministik, ~170px'e yakın bir iskelet eklendi
             (öncesinde iskelet hiç yoktu, içerik gelince sıfırdan ~170-190px'lik bir
             kayma oluyordu). -->
        <div id="daily-tip" class="fadeIn">
          <div class="skeleton h-40 w-full" style="border-radius: var(--radius);"></div>
        </div>

        <!-- 3. Öncelikli duyuru — kasıtlı olarak iskeletsiz bırakıldı: bu kart öğrencinin
             sınav türüne uygun haber olup olmamasına göre ya ~260-320px ya da 0px (hiç)
             render oluyor; sabit bir iskelet, "haber yok" durumunda (muhtemelen daha az
             CLS önemli olan taraf) kendi kayma sorununu yaratırdı. -->
        <div id="top-news"></div>

        <!-- 4. Bugünkü durum — gerçek kart yüksekliği sabit ~109px, en yakın Tailwind
             ölçeği h-28 (112px) kullanıldı (eskiden h-20/80px, ~30px kısaydı). -->
        <div id="today-status" class="fadeIn">
          <div class="skeleton h-28 w-full"></div>
        </div>

        <!-- 6. Tek öncelik — "öncelik var" durumu (daha yaygın/değerli, ~340-396px) hedef
             alınarak 360px'e çıkarıldı; eskiden h-32 (128px) idi, gerçek karttan neredeyse
             3 kat kısaydı. -->
        <div id="today-priority" class="fadeIn">
          <div class="skeleton h-[360px] w-full"></div>
        </div>

        <!-- 5+7. Program zaman çizelgesi — görev sayısına göre gerçek yükseklik değişken
             (ölçülen örnek: 5 görevle ~865-881px); tipik dolu bir gün için makul bir orta
             değer olan 520px'e çıkarıldı (eskiden h-40/160px, birkaç göreve bile
             yetmiyordu). -->
        <div id="schedule-timeline" class="fadeIn">
          <div class="skeleton h-[520px] w-full"></div>
        </div>

        <!-- 8. Başarı oranı — gerçek yükseklik sabit ~166px, en yakın ölçek h-40 (160px)
             kullanıldı (eskiden h-24/96px). -->
        <div id="success-rate" class="fadeIn">
          <div class="skeleton h-40 w-full"></div>
        </div>

        <!-- 9. Haftalık ilerleme — gerçek yükseklik sabit ~237px, en yakın ölçek h-56
             (224px) kullanıldı (eskiden h-48/192px). -->
        <div id="weekly-progress" class="fadeIn">
          <div class="skeleton h-56 w-full"></div>
        </div>

        <div id="error-state" class="hidden card p-8 text-center">
          <div class="mb-3 flex justify-center text-slate-300"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.4" class="icon-svg" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M15.182 16.318A4.486 4.486 0 0 0 12.016 15a4.486 4.486 0 0 0-3.198 1.318M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-13.5-3h.008v.008H7.5V9Zm9 0h.008v.008H16.5V9Z" /></svg></div>
          <p class="text-slate-600 font-medium mb-1">Ana sayfa yüklenirken bir sorun oluştu.</p>
          <p class="text-sm text-slate-400 mb-4">Lütfen tekrar dene.</p>
          <button id="retry-btn" class="btn-primary px-5 py-2.5">Tekrar Dene</button>
        </div>
      </div>
    </main>
    <nav id="bottomnav"></nav>
  </div>

  <!-- Floating AI Assistant Button -->
  <a href="assistant.html" class="fixed bottom-24 md:bottom-6 right-4 md:right-6 z-50 w-14 h-14 rounded-full flex items-center justify-center text-white shadow-lg" style="background: linear-gradient(135deg, #0f766e, #0ea5e9 55%, #22d3ee); box-shadow: 0 8px 22px rgba(15,118,110,.5);" title="AI Asistan">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" class="icon-svg" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456Z" /></svg>
  </a>

  <script type="module" src="js/dashboard.js?v=5"></script>
</body>
</html>

<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ana Sayfa · KPSS Akıllı</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
<link rel="stylesheet" href="css/tailwind-static.css" />
<link rel="stylesheet" href="css/styles.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" />
</head>
<body class="bg-slate-50">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content w-full">
      <div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-5 pb-10 stagger">

        <!-- 1+2. Hero: selamlama + rozet istatistikleri + sınav geri sayımı, tek büyük kartta -->
        <div id="hero-card" class="fadeIn">
          <div class="skeleton h-56 w-full" style="border-radius: var(--radius);"></div>
        </div>

        <!-- Günün ipucu (motivasyon) -->
        <div id="daily-tip" class="fadeIn"></div>

        <!-- 3. Öncelikli duyuru -->
        <div id="top-news"></div>

        <!-- 4. Bugünkü durum -->
        <div id="today-status" class="fadeIn">
          <div class="skeleton h-20 w-full"></div>
        </div>

        <!-- 6. Tek öncelik -->
        <div id="today-priority" class="fadeIn">
          <div class="skeleton h-32 w-full"></div>
        </div>

        <!-- 5+7. Program zaman çizelgesi -->
        <div id="schedule-timeline" class="fadeIn">
          <div class="skeleton h-40 w-full"></div>
        </div>

        <!-- 8. Başarı oranı -->
        <div id="success-rate" class="fadeIn">
          <div class="skeleton h-24 w-full"></div>
        </div>

        <!-- 9. Haftalık ilerleme -->
        <div id="weekly-progress" class="fadeIn">
          <div class="skeleton h-48 w-full"></div>
        </div>

        <div id="error-state" class="hidden card p-8 text-center">
          <div class="text-4xl mb-3">😕</div>
          <p class="text-slate-600 font-medium mb-1">Ana sayfa yüklenirken bir sorun oluştu.</p>
          <p class="text-sm text-slate-400 mb-4">Lütfen tekrar dene.</p>
          <button id="retry-btn" class="btn-primary px-5 py-2.5">Tekrar Dene</button>
        </div>
      </div>
    </main>
    <nav id="bottomnav"></nav>
  </div>

  <!-- Floating AI Assistant Button -->
  <a href="assistant.html" class="fixed bottom-24 md:bottom-6 right-4 md:right-6 z-50 w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-lg" style="background: linear-gradient(135deg, #4338ca, #7c3aed 55%, #a855f7); box-shadow: 0 8px 22px rgba(76,29,149,.5);" title="AI Asistan">
    🤖
  </a>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>

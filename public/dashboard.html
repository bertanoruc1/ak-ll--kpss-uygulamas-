<!doctype html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ana Sayfa · KPSS Akıllı</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body class="bg-slate-50">
  <div class="app-shell">
    <aside id="sidebar"></aside>
    <main class="main-content w-full">
      <div class="max-w-3xl mx-auto p-4 sm:p-6 space-y-5 pb-10">

        <!-- 1. Selamlama -->
        <div class="flex items-start justify-between gap-3">
          <div id="greeting-box" class="fadeIn">
            <div class="skeleton h-7 w-48 mb-2"></div>
            <div class="skeleton h-4 w-32"></div>
          </div>
          <a href="notifications.html" class="relative shrink-0 w-11 h-11 rounded-xl bg-white border border-slate-200 flex items-center justify-center text-xl shadow-sm hover:bg-slate-50 transition">
            🔔
            <span id="notif-badge" class="hidden absolute -top-1.5 -right-1.5 min-w-[20px] h-5 px-1 rounded-full bg-rose-600 text-white text-[11px] font-bold flex items-center justify-center">0</span>
          </a>
        </div>

        <!-- 2. Sınav geri sayımı -->
        <div id="exam-countdown" class="fadeIn">
          <div class="skeleton h-32 w-full"></div>
        </div>

        <!-- 3. Öncelikli duyuru -->
        <div id="top-news"></div>

        <!-- 4. Bugünkü durum -->
        <div id="today-status" class="fadeIn">
          <div class="skeleton h-20 w-full"></div>
        </div>

        <!-- 6. Tek öncelik -->
        <div id="today-priority" class="fadeIn">
          <div class="skeleton h-32 w-full"></div>
        </div>

        <!-- 5+7. Program zaman çizelgesi -->
        <div id="schedule-timeline" class="fadeIn">
          <div class="skeleton h-40 w-full"></div>
        </div>

        <!-- 8. Başarı oranı -->
        <div id="success-rate" class="fadeIn">
          <div class="skeleton h-24 w-full"></div>
        </div>

        <!-- 9. Haftalık ilerleme -->
        <div id="weekly-progress" class="fadeIn">
          <div class="skeleton h-48 w-full"></div>
        </div>

        <div id="error-state" class="hidden card p-8 text-center">
          <div class="text-4xl mb-3">😕</div>
          <p class="text-slate-600 font-medium mb-1">Ana sayfa yüklenirken bir sorun oluştu.</p>
          <p class="text-sm text-slate-400 mb-4">Lütfen tekrar dene.</p>
          <button id="retry-btn" class="btn-primary px-5 py-2.5">Tekrar Dene</button>
        </div>
      </div>
    </main>
    <nav id="bottomnav"></nav>
  </div>

  <!-- Floating AI Assistant Button -->
  <a href="assistant.html" class="fixed bottom-24 md:bottom-6 right-4 md:right-6 z-50 w-14 h-14 rounded-full flex items-center justify-center text-2xl shadow-lg" style="background: linear-gradient(135deg, #6366f1, #7c3aed); box-shadow: 0 6px 20px rgba(99,102,241,.45);" title="AI Asistan">
    🤖
  </a>

  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
